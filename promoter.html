<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Promoter Login | Jenny Slyder</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .login-wrap{min-height:calc(100vh - 140px);display:grid;place-items:center;padding:42px 20px}.login-box{width:min(520px,100%);border:1px solid var(--line);background:#070707;padding:34px;box-shadow:0 30px 80px rgba(0,0,0,.5)}input{width:100%;padding:14px;margin:8px 0 16px;background:#111;border:1px solid var(--line);color:var(--text)}label{font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:.8rem}.hidden{display:none}.resource-list a{color:var(--gold)}
  </style>
</head>
<body>
  <header class="site-header"><a class="brand" href="index.html"><span>JENNY</span> <strong>SLYDER</strong></a><nav class="nav-links"><a href="index.html#home">Home</a><a href="index.html#booking">Booking</a></nav></header>
  <main class="login-wrap">
    <section class="login-box" id="loginBox">
      <h2>Promoter Login</h2>
      <p>Enter the promoter password to view EPK, setlist, and promo resources.</p>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" />
      <button class="btn primary" onclick="checkPassword()">Enter</button>
      <p id="error" class="small-note" aria-live="polite"></p>
    </section>
    <section class="login-box hidden" id="resources">
      <h2>Promoter Resources</h2>
      <p>Replace these links with your actual EPK, setlists, photos, and promo files.</p>
      <ul class="resource-list">
        <li><a href="assets/EPK-placeholder.pdf">EPK PDF</a></li>
        <li><a href="assets/setlist-placeholder.pdf">General Setlist</a></li>
        <li><a href="assets/promo-links.txt">Promo Links</a></li>
      </ul>
    </section>
  </main>
  <script>
    const PASSWORD = 'jenny';
    function checkPassword(){
      const typed = document.getElementById('password').value.trim();
      if (typed === PASSWORD) {
        document.getElementById('loginBox').classList.add('hidden');
        document.getElementById('resources').classList.remove('hidden');
      } else {
        document.getElementById('error').textContent = 'Incorrect password.';
      }
    }
  </script>
</body>
</html>
